services:
  - type: web
    name: cefr-evaluator-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: cefr-evaluator-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: RECOMMENDATION_SERVICE_URL
        sync: false
      - key: RECOMMENDATION_REQUEST_TIMEOUT_MS
        value: "6000"
      - key: TRAINING_DATA_SALT
        generateValue: true
      - key: ALLOW_DEV_RESET_URLS
        value: "false"

  - type: web
    name: cefr-evaluator-ml
    runtime: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ALLOW_MODEL_RELOAD
        value: "false"
      - key: MODEL_RELOAD_TOKEN
        generateValue: true
